<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* Pretendard 웹폰트 (한글 2,350자 서브셋): PC 설치본 → jsDelivr → unpkg 순. 모두 실패하면 RD.FONT 의 시스템 폰트 */
  @font-face { font-family: 'Pretendard'; font-weight: 400; font-display: swap;
    src: local('Pretendard Regular'), local('Pretendard-Regular'),
      url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2') format('woff2'),
      url('https://unpkg.com/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2') format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 700; font-display: swap;
    src: local('Pretendard Bold'), local('Pretendard-Bold'),
      url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2') format('woff2'),
      url('https://unpkg.com/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2') format('woff2'); }
</style>

</style>
